<div class="container mt-3">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-body">
          <h4>New Customer</h4>
          <form [formGroup]="newCustomerFormGroup"
                (ngSubmit)="handleSaveCustomer()">

            <div class="mb-3">
              <label class="form-label">Name</label>
              <input type="text" formControlName="name"
                     class="form-control">
              <div *ngIf="newCustomerFormGroup.controls['name'].invalid
                       && newCustomerFormGroup.controls['name'].touched">
                <small class="text-danger"
                       *ngIf="newCustomerFormGroup.controls['name'].errors?.['required']">
                  Name is required
                </small>
                <small class="text-danger"
                       *ngIf="newCustomerFormGroup.controls['name'].errors?.['minlength']">
                  Minimum 4 characters
                </small>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" formControlName="email"
                     class="form-control">
              <div *ngIf="newCustomerFormGroup.controls['email'].invalid
                       && newCustomerFormGroup.controls['email'].touched">
                <small class="text-danger"
                       *ngIf="newCustomerFormGroup.controls['email'].errors?.['required']">
                  Email is required
                </small>
                <small class="text-danger"
                       *ngIf="newCustomerFormGroup.controls['email'].errors?.['email']">
                  Invalid email format
                </small>
              </div>
            </div>

            <button type="submit" class="btn btn-success"
                    [disabled]="newCustomerFormGroup.invalid">
              Save
            </button>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
